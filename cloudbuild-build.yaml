# Cloud Build configuration for Mock Shield (InfoExchange) API - Build & Push only
steps:
  # Build Docker container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/mock-shield-api:${_TAG}'
      - '.'
    id: 'build_container'

  # Tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'tag'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/mock-shield-api:${_TAG}'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/mock-shield-api:latest'
    id: 'add_latest_tag'
    waitFor: ['build_container']

# Substitution variables
# NOTE: confirm _REPO_NAME matches your corpops Artifact Registry repo -
# this is carried over from your existing Everbridge cloudbuild_app.yaml
# naming convention and may need adjusting.
substitutions:
  _TAG: 'v1.0.0'
  _REGION: 'europe-west1'
  _REPO_NAME: 'dta-corpops-cloudrun'

# Push images to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/mock-shield-api:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/mock-shield-api:latest'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
